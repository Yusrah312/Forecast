<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER FORECAST</title>
    <link rel="stylesheet" href="../CSS/forecast.css">
</head>
<body>
    <main class="section">
        <h1>Weather <span>Forecast</span> </h1> <br>
        <div class="container">
            <input type="text" class="form-control" id="cityInput" placeholder="Enter city name">
            <button id="getWeatherBtn" onclick="getForecast()">Get Forecast</button>
        </div>
        <div class="box">
            <div class="temperature-wrapper">
                <div id="weather-container"></div>
            </div>
            <div class="div">
                <p id="errorMsg"></p>
                <p id="result"></p>
                <data id="weatherData" style="display: none;"></data>
            </div>
            
        </div>


    </main>
    <script src="../JS/forecast.js"></script>
</body>
</html>
